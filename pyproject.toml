[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-bird-cli"
dynamic = ["version"]
description = "Agent-friendly CLI for the Bluebird macOS focus app"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/includeno/blue-bird-cli"
Documentation = "https://github.com/includeno/blue-bird-cli/tree/main/docs"
Issues = "https://github.com/includeno/blue-bird-cli/issues"
Changelog = "https://github.com/includeno/blue-bird-cli/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "bluebird_cli.__version__"}

[project.scripts]
bluebird = "bluebird_cli.cli:main"

[tool.setuptools.packages.find]
include = ["bluebird_cli*"]

[tool.setuptools.package-data]
bluebird_cli = ["native/*.swift", "web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
