name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist
      - name: Install wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/bluebird-wheel"
          "$RUNNER_TEMP/bluebird-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bluebird-wheel/bin/bluebird" --version
          "$RUNNER_TEMP/bluebird-wheel/bin/bluebird" capabilities
          "$RUNNER_TEMP/bluebird-wheel/bin/bluebird" start web --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  native:
    name: macOS (${{ matrix.os }})
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: python -B -m unittest discover -s tests -v
      - name: Install and compile on a clean runner
        env:
          BLUEBIRD_CLI_HOME: ${{ runner.temp }}/bluebird-native
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          bluebird --version
          bluebird capabilities
          bluebird --full-access setup
